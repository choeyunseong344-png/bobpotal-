<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밥자리 - 석식 신청권 거래 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 z-10">
    <div>
      <div class="flex items-center gap-2 mb-8 px-2">
        <i class="ph-bold ph-fork-knife text-2xl text-purple-600"></i>
        <span class="text-xl font-bold tracking-tight text-slate-800">밥자리</span>
      </div>
      <nav class="space-y-1">
        <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm text-slate-700 bg-slate-100">
          <i class="ph ph-shopping-bag-open text-lg"></i> 석식 신청권 양도
        </button>
      </nav>
    </div>

    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-bold text-xs">학</div>
        <div>
          <p id="user-display-name" class="text-xs font-semibold text-slate-800">게스트 (로그인 필요)</p>
          <p id="user-display-id" class="text-[11px] text-slate-400">서라벌고등학교</p>
        </div>
      </div>
      <button onclick="openAuthModal()" class="text-xs bg-slate-200 px-2.5 py-1 rounded-lg font-bold">인증</button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="h-14 border-b border-slate-200 bg-white/80 backdrop-blur px-8 flex items-center justify-between sticky top-0 z-10">
      <span class="text-xs font-semibold text-slate-800">서라벌고 석식 양도 거래소</span>
      <button onclick="openPostModal()" class="bg-slate-900 text-white font-semibold text-xs px-4 py-2 rounded-xl hover:bg-slate-800">
        + 석식 양도 글쓰기
      </button>
    </header>

    <main class="p-8 max-w-5xl w-full mx-auto space-y-6">
      <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6">
        <h1 class="text-2xl font-bold text-slate-900">못 먹는 석식, 필요한 친구에게 양도해요</h1>
        <p class="text-xs text-slate-500 mt-1">1대1 안전 채팅과 거래 완료 후 학번 알림 전송 시스템 적용</p>
      </div>

      <div class="grid grid-cols-3 gap-6">
        <div class="col-span-2 space-y-4">
          <h2 class="text-lg font-bold text-slate-900">올라온 양도 목록</h2>
          <div id="posts-container" class="space-y-3"></div>
        </div>

        <div id="chat-card" class="bg-white border border-slate-200 rounded-2xl p-4 hidden flex-col h-[400px]">
          <h3 class="font-bold text-sm border-b pb-2 text-slate-800">1대1 거래 채팅방</h3>
          <div id="chat-box" class="flex-1 overflow-y-auto my-2 space-y-2 text-xs"></div>
          <div class="flex gap-1">
            <input type="text" id="chat-input" placeholder="메시지 입력" class="flex-1 border text-xs px-2 py-1.5 rounded-lg outline-none">
            <button onclick="sendMessage()" class="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg">전송</button>
          </div>
          <button id="complete-btn" onclick="completeTrade()" class="w-full bg-green-600 text-white text-xs py-2 rounded-lg font-bold mt-2">
            거래 완료하기
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="auth-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md space-y-3 shadow-xl">
      <h3 class="font-bold text-base text-slate-800 border-b pb-2">회원가입 / 로그인</h3>
      
      <div class="flex gap-2">
        <input type="text" id="reg-username" placeholder="아이디" class="flex-1 px-3 py-2 text-xs border rounded-xl outline-none">
        <button type="button" onclick="checkUsername()" class="px-3 py-2 bg-slate-100 text-xs font-bold rounded-xl whitespace-nowrap">아이디 중복확인</button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="reg-nickname" placeholder="닉네임" class="flex-1 px-3 py-2 text-xs border rounded-xl outline-none">
        <button type="button" onclick="checkNickname()" class="px-3 py-2 bg-slate-100 text-xs font-bold rounded-xl whitespace-nowrap">닉네임 중복확인</button>
      </div>
      <input type="password" id="reg-password" placeholder="비밀번호" class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
      <input type="password" id="reg-password-confirm" placeholder="비밀번호 재확인" class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
      <input type="text" id="reg-name" placeholder="이름" class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
      <input type="text" id="reg-phone" placeholder="전화번호" class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
      <input type="text" id="reg-school" value="서라벌고등학교" readonly class="w-full px-3 py-2 text-xs border bg-slate-50 rounded-xl outline-none">
      <input type="text" id="reg-student-id" placeholder="학번 (예: 20301)" class="w-full px-3 py-2 text-xs border rounded-xl outline-none">

      <div class="text-xs text-slate-500">
        <p class="font-bold mb-1">석식 신청 요일 선택:</p>
        <div class="flex gap-2">
          <label><input type="checkbox" name="dinnerDay" value="월"> 월</label>
          <label><input type="checkbox" name="dinnerDay" value="화"> 화</label>
          <label><input type="checkbox" name="dinnerDay" value="수"> 수</label>
          <label><input type="checkbox" name="dinnerDay" value="목"> 목</label>
          <label><input type="checkbox" name="dinnerDay" value="금"> 금</label>
        </div>
      </div>

      <div class="text-xs pt-1">
        <label class="flex items-center gap-1.5 text-slate-600">
          <input type="checkbox" id="reg-terms"> [필수] 개인정보 처리방침 및 이용약관 동의
        </label>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="login()" class="flex-1 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">로그인</button>
        <button onclick="register()" class="flex-1 py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">회원가입</button>
      </div>
    </div>
  </div>

  <div id="post-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md space-y-3 shadow-xl">
      <h3 class="font-bold text-base border-b pb-2">석식 양도글 작성</h3>
      <select id="post-day" class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
        <option value="월">월요일</option>
        <option value="화">화요일</option>
        <option value="수">수요일</option>
        <option value="목">목요일</option>
        <option value="금">금요일</option>
      </select>
      <textarea id="post-desc" placeholder="상세 설명을 작성하세요" class="w-full px-3 py-2 text-xs border rounded-xl h-20 outline-none"></textarea>
      <button onclick="createPost()" class="w-full py-2 bg-slate-900 text-white text-xs font-bold rounded-xl">올리기</button>
    </div>
  </div>

<script>
  let currentUser = null;
  let isUsernameChecked = false;
  let isNicknameChecked = false;
  let currentRoomId = null;

  async function checkUsername() {
    const username = document.getElementById('reg-username').value;
    const res = await fetch(`/api/check-username?username=${username}`);
    const data = await res.json();
    if(res.ok) { alert(data.message); isUsernameChecked = true; } 
    else { alert(data.error); isUsernameChecked = false; }
  }

  async function checkNickname() {
    const nickname = document.getElementById('reg-nickname').value;
    const res = await fetch(`/api/check-nickname?nickname=${nickname}`);
    const data = await res.json();
    if(res.ok) { alert(data.message); isNicknameChecked = true; } 
    else { alert(data.error); isNicknameChecked = false; }
  }

  async function register() {
    if(!isUsernameChecked || !isNicknameChecked) {
      return alert('아이디와 닉네임 중복확인을 모두 진행해주세요.');
    }
    const dinnerDays = Array.from(document.querySelectorAll('input[name="dinnerDay"]:checked')).map(cb => cb.value);

    const body = {
      username: document.getElementById('reg-username').value,
      nickname: document.getElementById('reg-nickname').value,
      password: document.getElementById('reg-password').value,
      passwordConfirm: document.getElementById('reg-password-confirm').value,
      name: document.getElementById('reg-name').value,
      phone: document.getElementById('reg-phone').value,
      school: document.getElementById('reg-school').value,
      studentId: document.getElementById('reg-student-id').value,
      dinnerDays,
      termsAgreed: document.getElementById('reg-terms').checked
    };

    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(res.ok) alert('회원가입 완료! 로그인하세요.'); 
    else alert(data.error);
  }

  async function login() {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('reg-username').value,
        password: document.getElementById('reg-password').value
      })
    });
    const data = await res.json();
    if(res.ok) {
      currentUser = data.user;
      document.getElementById('user-display-name').innerText = currentUser.nickname;
      document.getElementById('auth-modal').classList.add('hidden');
      loadPosts();
    } else alert(data.error);
  }

  async function createPost() {
    const res = await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sellerId: currentUser.id,
        dayOfWeek: document.getElementById('post-day').value,
        description: document.getElementById('post-desc').value
      })
    });
    const data = await res.json();
    if(res.ok) { alert('양도 글이 올려졌습니다.'); document.getElementById('post-modal').classList.add('hidden'); loadPosts(); } 
    else alert(data.error);
  }

  async function loadPosts() {
    const res = await fetch('/api/posts');
    const posts = await res.json();
    document.getElementById('posts-container').innerHTML = posts.map(p => `
      <div class="p-4 border bg-white rounded-xl flex items-center justify-between">
        <div>
          <span class="px-2 py-0.5 bg-purple-100 text-purple-700 text-[10px] font-bold rounded">${p.dayOfWeek}요일</span>
          <span class="text-xs font-bold ml-1">${p.sellerNickname}</span>
          <p class="text-xs text-slate-600 mt-1">${p.description}</p>
        </div>
        <button onclick="requestTrade(${p.id})" class="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg">구매 신청</button>
      </div>
    `).join('');
  }

  async function requestTrade(postId) {
    if(!currentUser) return alert('로그인 후 이용 가능합니다.');
    const res = await fetch('/api/trade-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postId, buyerId: currentUser.id })
    });
    const data = await res.json();
    if(res.ok) {
      currentRoomId = data.roomId;
      document.getElementById('chat-card').classList.remove('hidden');
      document.getElementById('chat-card').classList.add('flex');
      setInterval(fetchChat, 2000);
    } else alert(data.error);
  }

  async function fetchChat() {
    if(!currentRoomId) return;
    const res = await fetch(`/api/chat/messages?roomId=${currentRoomId}`);
    const data = await res.json();
    document.getElementById('chat-box').innerHTML = data.messages.map(m => `
      <div class="p-2 bg-slate-100 rounded-lg">
        <strong>${m.sender_nickname}:</strong> ${m.message}
      </div>
    `).join('');
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    await fetch('/api/chat/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roomId: currentRoomId, senderNickname: currentUser.nickname, message: input.value })
    });
    input.value = '';
    fetchChat();
  }

  async function completeTrade() {
    const res = await fetch('/api/chat/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roomId: currentRoomId, sellerId: currentUser.id })
    });
    const data = await res.json();
    if(res.ok) fetchChat();
    else alert(data.error);
  }

  function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); document.getElementById('auth-modal').classList.add('flex'); }
  function openPostModal() { if(!currentUser) return alert('로그인이 필요합니다.'); document.getElementById('post-modal').classList.remove('hidden'); document.getElementById('post-modal').classList.add('flex'); }

  loadPosts();
</script>
</body>
</html>
