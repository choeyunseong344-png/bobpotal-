<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밥포탈 (bobpotal)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f8; color: #333; line-height: 1.6; }
        
        header { background: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1e4e8; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4F46E5; cursor: pointer; }
        #auth-buttons button { margin-left: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #4F46E5; background: #fff; color: #4F46E5; cursor: pointer; font-weight: bold; }
        #auth-buttons button:last-child { background: #4F46E5; color: #fff; }

        main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        
        .meal-container, .board-container { background: #fff; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .meal-container h2, .board-header h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #111; }
        .meal-box { display: flex; gap: 1rem; }
        .meal-item { flex: 1; background: #f9fafb; padding: 1rem; border-radius: 8px; border: 1px solid #edf2f7; }
        .meal-item h3 { font-size: 1rem; color: #4F46E5; margin-bottom: 0.5rem; }
        .meal-item p { font-size: 0.95rem; white-space: pre-wrap; }

        .board-header { display: flex; justify-content: space-between; align-items: center; }
        .board-header button { padding: 0.4rem 0.8rem; background: #4F46E5; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .post-item { padding: 1rem 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal-content { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 2rem; border-radius: 10px; position: relative; }
        .close { position: absolute; right: 1.2rem; top: 1rem; font-size: 1.5rem; cursor: pointer; }
        .modal-content h2 { margin-bottom: 1.5rem; }
        .modal-content input { width: 100%; padding: 0.7rem; margin-bottom: 0.8rem; border: 1px solid #ccc; border-radius: 6px; }
        .input-group { display: flex; gap: 0.5rem; }
        .input-group input { flex: 1; }
        .input-group button { padding: 0.7rem; height: 42px; background: #374151; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .submit-btn { width: 100%; padding: 0.8rem; background: #4F46E5; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
        .error-msg { font-size: 0.8rem; margin-top: -0.5rem; margin-bottom: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.reload()">밥포탈</div>
        <div id="auth-buttons">
            <button onclick="openModal('login-modal')">로그인</button>
            <button onclick="openModal('register-modal')">회원가입</button>
        </div>
    </header>

    <main>
        <section class="meal-container">
            <h2>서라벌고등학교 오늘의 급식</h2>
            <div class="meal-box">
                <div class="meal-item">
                    <h3>☀️ 점심 (중식)</h3>
                    <p id="lunch-menu">불러오는 중...</p>
                </div>
                <div class="meal-item">
                    <h3>🌙 저녁 (석식)</h3>
                    <p id="dinner-menu">불러오는 중...</p>
                </div>
            </div>
        </section>

        <section class="board-container">
            <div class="board-header">
                <h2>급식 거래 게시판</h2>
                <button onclick="openModal('write-modal')">글쓰기</button>
            </div>
            <div id="posts-list"></div>
        </section>
    </main>

    <!-- 회원가입 모달 -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('register-modal')">&times;</span>
            <h2>회원가입</h2>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="text" id="reg-username" placeholder="아이디" required>
                    <button type="button" onclick="checkDuplicate('username')">중복확인</button>
                </div>
                <p id="msg-username" class="error-msg"></p>

                <div class="input-group">
                    <input type="text" id="reg-nickname" placeholder="닉네임" required>
                    <button type="button" onclick="checkDuplicate('nickname')">중복확인</button>
                </div>
                <p id="msg-nickname" class="error-msg"></p>

                <input type="password" id="reg-password" placeholder="비밀번호" required>
                <input type="text" id="reg-name" placeholder="이름" required>
                <input type="text" id="reg-phone" placeholder="전화번호" required>
                <input type="text" id="reg-student-id" placeholder="학번" required>

                <button type="submit" class="submit-btn">가입하기</button>
            </form>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('login-modal')">&times;</span>
            <h2>로그인</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="login-username" placeholder="아이디" required>
                <input type="password" id="login-password" placeholder="비밀번호" required>
                <button type="submit" class="submit-btn">로그인</button>
            </form>
        </div>
    </div>

    <script>
        let isUsernameChecked = false;
        let isNicknameChecked = false;
        let currentUser = null;

        window.onload = function() {
            loadMeal();
            loadPosts();
        };

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 급식 불러오기
        function loadMeal() {
            fetch('/api/meal')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('lunch-menu').innerText = data.lunch || '오늘 점심 정보가 없습니다.';
                    document.getElementById('dinner-menu').innerText = data.dinner || '오늘 저녁 정보가 없습니다.';
                })
                .catch(() => {
                    document.getElementById('lunch-menu').innerText = '급식 정보를 불러올 수 없습니다.';
                    document.getElementById('dinner-menu').innerText = '급식 정보를 불러올 수 없습니다.';
                });
        }

        // 중복확인 (오류 완벽 방지)
        function checkDuplicate(field) {
            const val = document.getElementById(`reg-${field}`).value.trim();
            const msgEl = document.getElementById(`msg-${field}`);

            if (!val) {
                msgEl.innerText = '입력해 주세요.';
                msgEl.style.color = 'red';
                return;
            }

            fetch('/api/check-duplicate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field: field, value: val })
            })
            .then(res => res.json())
            .then(data => {
                msgEl.innerText = data.message;
                if (data.available) {
                    msgEl.style.color = 'green';
                    if (field === 'username') isUsernameChecked = true;
                    if (field === 'nickname') isNicknameChecked = true;
                } else {
                    msgEl.style.color = 'red';
                    if (field === 'username') isUsernameChecked = false;
                    if (field === 'nickname') isNicknameChecked = false;
                }
            })
            .catch(() => {
                msgEl.innerText = 'DB 확인 오류: Vercel 환경변수를 확인하세요.';
                msgEl.style.color = 'red';
            });
        }

        // 회원가입
        function handleRegister(e) {
            e.preventDefault();
            if (!isUsernameChecked || !isNicknameChecked) {
                alert('아이디와 닉네임 중복확인을 해주세요.');
                return;
            }

            const body = {
                username: document.getElementById('reg-username').value,
                nickname: document.getElementById('reg-nickname').value,
                password: document.getElementById('reg-password').value,
                name: document.getElementById('reg-name').value,
                phone: document.getElementById('reg-phone').value,
                school: '서라벌고등학교',
                student_id: document.getElementById('reg-student-id').value
            };

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('회원가입 성공!');
                    closeModal('register-modal');
                    openModal('login-modal');
                } else {
                    alert('가입 실패: ' + data.error);
                }
            });
        }

        // 로그인
        function handleLogin(e) {
            e.preventDefault();
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('login-username').value,
                    password: document.getElementById('login-password').value
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentUser = data.user;
                    alert(`${currentUser.nickname}님 환영합니다!`);
                    closeModal('login-modal');
                    document.getElementById('auth-buttons').innerHTML = `<span>${currentUser.nickname}님</span> <button onclick="location.reload()">로그아웃</button>`;
                } else {
                    alert(data.error);
                }
            });
        }

        // 게시글 목록
        function loadPosts() {
            fetch('/api/posts')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('posts-list');
                    if (!data || data.length === 0) {
                        list.innerHTML = '<p>등록된 게시물이 없습니다.</p>';
                        return;
                    }
                    list.innerHTML = data.map(post => `
                        <div class="post-item">
                            <h4>${post.title}</h4>
                            <p>${post.price}원 | ${post.meal_date}</p>
                        </div>
                    `).join('');
                });
        }
    </script>
</body>
</html>
