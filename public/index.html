<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밥포탈 - 학생 석식 티켓 교환 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Pretendard', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
    .btn-primary:hover { opacity: 0.9; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <nav class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
      <div class="bg-indigo-600 p-2 rounded-xl text-white">
        <i class="fa-solid fa-utensils text-xl"></i>
      </div>
      <span class="text-2xl font-extrabold tracking-tight text-white">밥포탈</span>
    </div>
    <div id="auth-buttons" class="space-x-3">
      <button onclick="openModal('login-modal')" class="px-4 py-2 text-sm text-slate-300 hover:text-white transition">로그인</button>
      <button onclick="openModal('register-modal')" class="px-4 py-2 text-sm font-semibold btn-primary text-white rounded-lg shadow-md transition">회원가입</button>
    </div>
    <div id="user-profile" class="hidden items-center space-x-4">
      <span id="user-display-name" class="text-sm font-medium text-slate-300"></span>
      <button onclick="openModal('post-modal')" class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition">티켓 양도하기</button>
      <button onclick="logout()" class="px-3 py-2 text-xs text-slate-400 hover:text-red-400">로그아웃</button>
    </div>
  </nav>

  <!-- Hero & Post List -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-8">
    <header class="text-center py-8 space-y-3">
      <h1 class="text-4xl font-extrabold text-white">오늘의 석식 티켓을 안전하게 교환하세요</h1>
      <p class="text-slate-400">학생 간 1:1 직거래 / 거래 완료 시 학생 정보 자동 공개 시스템</p>
    </header>

    <!-- Post Filter / List -->
    <div class="space-y-4">
      <h2 class="text-xl font-bold text-slate-200 flex items-center">
        <i class="fa-solid fa-[#6366f1] fa-ticket mr-2 text-indigo-500"></i> 실시간 올라온 티켓
      </h2>
      <div id="post-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS로 게시글 동적 로드 -->
      </div>
    </div>
  </main>

  <!-- 회원가입 모달 -->
  <div id="register-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-6 rounded-2xl space-y-4 border border-slate-700">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold text-white">밥포탈 회원가입</h3>
        <button onclick="closeModal('register-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-3">
        <div class="flex space-x-2">
          <input type="text" id="reg-username" placeholder="아이디" required class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          <button type="button" onclick="checkUsername()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg text-white">중복확인</button>
        </div>
        <div class="flex space-x-2">
          <input type="text" id="reg-nickname" placeholder="닉네임" required class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          <button type="button" onclick="checkNickname()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg text-white">중복확인</button>
        </div>
        <input type="password" id="reg-password" placeholder="비밀번호" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
        <input type="text" id="reg-name" placeholder="이름 (예: 홍길동)" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
        <input type="text" id="reg-phone" placeholder="전화번호" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="reg-school" placeholder="학교명" required class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
          <input type="text" id="reg-studentid" placeholder="학번" required class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
        </div>
        <div class="space-y-1">
          <label class="text-xs text-slate-400">석식 이용 요일 선택</label>
          <div class="flex gap-2 text-xs text-white">
            <label><input type="checkbox" value="월" class="reg-day"> 월</label>
            <label><input type="checkbox" value="화" class="reg-day"> 화</label>
            <label><input type="checkbox" value="수" class="reg-day"> 수</label>
            <label><input type="checkbox" value="목" class="reg-day"> 목</label>
            <label><input type="checkbox" value="금" class="reg-day"> 금</label>
          </div>
        </div>
        <div class="flex items-center space-x-2 pt-2">
          <input type="checkbox" id="reg-terms" required class="rounded bg-slate-800">
          <label for="reg-terms" class="text-xs text-slate-400">개인정보 수집 및 거래 이용약관 동의</label>
        </div>
        <button type="submit" class="w-full py-3 btn-primary text-white font-bold rounded-lg transition">가입 완료</button>
      </form>
    </div>
  </div>

  <!-- 로그인 모달 -->
  <div id="login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold text-white">로그인</h3>
        <button onclick="closeModal('login-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3">
        <input type="text" id="login-username" placeholder="아이디" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
        <input type="password" id="login-password" placeholder="비밀번호" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none">
        <button type="submit" class="w-full py-3 btn-primary text-white font-bold rounded-lg transition">로그인</button>
      </form>
    </div>
  </div>

  <!-- 게시글 등록 모달 -->
  <div id="post-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold text-white">석식 티켓 양도글 올리기</h3>
        <button onclick="closeModal('post-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleCreatePost(event)" class="space-y-3">
        <select id="post-day" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
          <option value="">양도할 요일 선택</option>
          <option value="월">월요일 석식</option>
          <option value="화">화요일 석식</option>
          <option value="수">수요일 석식</option>
          <option value="목">목요일 석식</option>
          <option value="금">금요일 석식</option>
        </select>
        <textarea id="post-desc" placeholder="상세 설명 (예: 5교시 끝나고 매점 앞 거래)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none h-24"></textarea>
        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition">등록하기</button>
      </form>
    </div>
  </div>

  <!-- 1:1 거래 채팅 모달 -->
  <div id="chat-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-lg w-full h-[500px] p-4 rounded-2xl flex flex-col justify-between">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-comments text-indigo-400 mr-2"></i> 1:1 거래 채팅방</h3>
        <button onclick="closeChatModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="chat-box" class="flex-1 overflow-y-auto py-3 space-y-2 px-1">
        <!-- 메시지 로드 -->
      </div>
      <div id="seller-info-box" class="hidden p-3 bg-emerald-950/80 border border-emerald-500/30 rounded-xl text-xs text-emerald-200 mb-2">
        <!-- 거래 완료 시 판매자 정보 표시 -->
      </div>
      <div class="flex space-x-2 border-t border-slate-700 pt-3">
        <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
        <button onclick="sendMessage()" class="px-4 py-2 btn-primary text-white text-sm rounded-lg">전송</button>
        <button id="complete-btn" onclick="completeTrade()" class="px-3 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded-lg">거래완료</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let isUsernameChecked = false;
    let isNicknameChecked = false;
    let activeRoomId = null;
    let chatInterval = null;

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function checkUsername() {
      const username = document.getElementById('reg-username').value;
      if (!username) return alert('아이디를 입력해주세요.');
      const res = await fetch('/api/check-username', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      alert(data.message);
      if (data.available) isUsernameChecked = true;
    }

    async function checkNickname() {
      const nickname = document.getElementById('reg-nickname').value;
      if (!nickname) return alert('닉네임을 입력해주세요.');
      const res = await fetch('/api/check-nickname', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ nickname })
      });
      const data = await res.json();
      alert(data.message);
      if (data.available) isNicknameChecked = true;
    }

    async function handleRegister(e) {
      e.preventDefault();
      if (!isUsernameChecked) return alert('아이디 중복 확인을 진행해주세요.');
      if (!isNicknameChecked) return alert('닉네임 중복 확인을 진행해주세요.');

      const dinner_days = Array.from(document.querySelectorAll('.reg-day:checked')).map(cb => cb.value);

      const payload = {
        username: document.getElementById('reg-username').value,
        nickname: document.getElementById('reg-nickname').value,
        password: document.getElementById('reg-password').value,
        name: document.getElementById('reg-name').value,
        phone: document.getElementById('reg-phone').value,
        school: document.getElementById('reg-school').value,
        student_id: document.getElementById('reg-studentid').value,
        dinner_days,
        terms_agreed: document.getElementById('reg-terms').checked
      };

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.success) {
        alert('회원가입 완료! 로그인해주세요.');
        closeModal('register-modal');
        openModal('login-modal');
      } else {
        alert(data.message);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        document.getElementById('auth-buttons').classList.add('hidden');
        document.getElementById('user-profile').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = `${currentUser.nickname} (${currentUser.school})`;
        closeModal('login-modal');
        loadPosts();
      } else {
        alert(data.message);
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('auth-buttons').classList.remove('hidden');
      document.getElementById('user-profile').classList.add('hidden');
    }

    async function loadPosts() {
      const res = await fetch('/api/posts');
      const data = await res.json();
      const listEl = document.getElementById('post-list');
      listEl.innerHTML = '';

      if (data.posts) {
        data.posts.forEach(post => {
          const card = document.createElement('div');
          card.className = "glass-card p-5 rounded-2xl space-y-3 border border-slate-800 hover:border-indigo-500/50 transition";
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <span class="px-2.5 py-1 text-xs font-bold bg-indigo-500/20 text-indigo-400 rounded-md border border-indigo-500/30">${post.day_of_week}요일 티켓</span>
              <span class="text-xs text-slate-400">${post.users?.school || ''}</span>
            </div>
            <p class="text-sm text-slate-300 font-medium">${post.description || '내용 없음'}</p>
            <div class="flex justify-between items-center pt-2 border-t border-slate-800">
              <span class="text-xs text-slate-500">작성자: ${post.users?.nickname || '익명'}</span>
              <button onclick="startChat(${post.id}, ${post.seller_id})" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition">거래하기</button>
            </div>
          `;
          listEl.appendChild(card);
        });
      }
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      if (!currentUser) return alert('로그인이 필요합니다.');

      const day_of_week = document.getElementById('post-day').value;
      const description = document.getElementById('post-desc').value;

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ seller_id: currentUser.id, day_of_week, description })
      });

      const data = await res.json();
      if (data.success) {
        alert('양도글이 생성되었습니다.');
        closeModal('post-modal');
        loadPosts();
      }
    }

    async function startChat(postId, sellerId) {
      if (!currentUser) return alert('로그인 후 이용 가능합니다.');
      if (currentUser.id === sellerId) return alert('본인이 작성한 글입니다.');

      const res = await fetch('/api/chat/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ post_id: postId, seller_id: sellerId, buyer_id: currentUser.id })
      });

      const data = await res.json();
      if (data.success) {
        activeRoomId = data.room.id;
        openModal('chat-modal');
        fetchMessages();
        chatInterval = setInterval(fetchMessages, 2000); // 2초 주기 폴링
      }
    }

    function closeChatModal() {
      closeModal('chat-modal');
      clearInterval(chatInterval);
      activeRoomId = null;
    }

    async function fetchMessages() {
      if (!activeRoomId) return;
      const res = await fetch(`/api/chat/messages/${activeRoomId}`);
      const data = await res.json();
      if (data.success) {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        data.messages.forEach(msg => {
          const isMine = msg.sender_nickname === currentUser.nickname;
          const msgEl = document.createElement('div');
          msgEl.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'}`;
          msgEl.innerHTML = `
            <span class="text-[10px] text-slate-500 mb-0.5">${msg.sender_nickname}</span>
            <div class="px-3 py-2 rounded-xl text-xs max-w-[80%] ${isMine ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'}">
              ${msg.message}
            </div>
          `;
          chatBox.appendChild(msgEl);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      if (!input.value.trim() || !activeRoomId) return;

      await fetch('/api/chat/message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          room_id: activeRoomId,
          sender_nickname: currentUser.nickname,
          message: input.value
        })
      });
      input.value = '';
      fetchMessages();
    }

    async function completeTrade() {
      if (!confirm('거래를 확정하시겠습니까? 거래 완료 시 상대방에게 나의 정보가 제공될 수 있습니다.')) return;

      const res = await fetch('/api/chat/complete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ room_id: activeRoomId })
      });

      const data = await res.json();
      if (data.success) {
        const infoBox = document.getElementById('seller-info-box');
        infoBox.classList.remove('hidden');
        infoBox.innerHTML = `
          <strong>🎉 거래가 확정되었습니다!</strong><br/>
          판매자 이름: ${data.seller_info.name}<br/>
          학번: ${data.seller_info.student_id}<br/>
          연락처: ${data.seller_info.phone}
        `;
      }
    }

    // 초기 게시글 조회
    loadPosts();
  </script>
</body>
</html>
